  - name: "Third Generation (HEV)"
    start_year: 2021
    end_year: null
    description: "The Haval H6 HEV is the hybrid variant of the third-generation H6, produced by Great Wall Motor since 2020 on the Lemon platform (B30). The HEV variant debuted at the 2021 Bangkok International Motor Show in March 2021. It features a 1.5-litre turbocharged GW4B15 engine producing 123 kW and 285 Nm of torque, paired with a 130 kW electric motor and 7-speed DCT hybrid transmission, delivering combined output of 243 PS (179 kW) and 530 Nm of torque. The interior features dual screens typically including a 10.25-inch digital instrument cluster and 12.3-inch central touchscreen, with minimal physical buttons. Standard technology includes wireless smartphone charging, voice control, and driver assistance systems including adaptive cruise control, lane keeping assist, and autonomous emergency braking. Production expanded globally with CKD assembly in Malaysia (2024), Thailand, and other markets. The 2024 facelift introduced a new front fascia with vertical LED daytime running lights, full-width light bar (later replaced by conventional taillights), increased length to 4703 mm, redesigned center console with 50W wireless charger, memory seats, column-style drive selector, and upgraded 14.6-inch infotainment display running Coffee OS 3.0."