generations:
  - name: "First Generation (Third-generation H6 with hybrid powertrain)"
    start_year: 2021
    end_year: null
    description: "The Haval H6 HEV is the hybrid variant of the third-generation H6, Great Wall Motor's popular compact SUV. Built on the company's Lemon platform, it features the same modern styling as the conventional H6 with a sleek, European-influenced design including a large grille, slim LED headlights, and a coupe-like roofline. The hybrid powertrain combines a 1.5L turbocharged four-cylinder engine with an electric motor for a combined output of approximately 240-243 HP (179-181 kW) and 530 Nm of torque, paired with a dedicated hybrid transmission (DHT). This system enables pure electric driving at low speeds, with the gasoline engine engaging when more power is needed or at higher speeds. The interior features a premium design with dual screens (typically a 10.25-inch digital instrument cluster and a 12.3-inch central touchscreen), minimal physical buttons, and high-quality materials. Standard technology includes wireless smartphone charging, voice control, and a comprehensive suite of driver assistance systems featuring adaptive cruise control, lane keeping assist, and autonomous emergency braking. The H6 HEV represents Haval's first serious entry into the hybrid SUV market, offering reduced fuel consumption (typically around 5.2L/100km combined) without sacrificing performance, as evidenced by its 0-100 km/h acceleration in approximately 7.5 seconds. As one of the brand's most technologically advanced models, the H6 HEV has helped enhance Haval's global market position, particularly in markets like Australia, Thailand, and South Africa where it competes with established Japanese and Korean hybrid SUVs."
